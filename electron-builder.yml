appId: io.github.m0hamedd.floatdot
productName: FloatDot
copyright: Copyright (c) 2026 M0hamedd
asar: true
directories:
  output: dist
files:
  - src/**/*
  - package.json
  - LICENSE*
  - NOTICE*
extraResources:
  - from: assets
    to: icons
    filter:
      - icon.png
      - icon.ico
# Explicitly include only the app. Profiles, diagnostic screenshots, tests,
# signing credentials and development dependencies must never ship.
artifactName: "floatdot-${version}-${os}-${arch}.${ext}"
publish: null
win:
  target: nsis
  executableName: FloatDot
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: FloatDot
  uninstallDisplayName: FloatDot
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
mac:
  executableName: FloatDot
  icon: assets/icon.icns
  extendInfo:
    CFBundleName: FloatDot
    CFBundleDisplayName: FloatDot
    NSMicrophoneUsageDescription: Allow ChatGPT voice features when you approve microphone access in FloatDot.
    NSCameraUsageDescription: Allow ChatGPT camera features when you approve camera access in FloatDot.
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # Local/CI developer builds only. Public macOS distribution needs a
  # Developer ID identity and notarization configured by the maintainer.
  identity: "-"
  hardenedRuntime: false
  notarize: false
linux:
  target: AppImage
  category: Utility
  icon: assets/icon.icns
