name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac
          - platform: Linux
            runner: ubuntu-24.04
            command: npm run dist:linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check security policy
        if: runner.os != 'Windows'
        run: node scripts/security.cjs
      - name: Check Windows behavior with owned-process cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/smoke.ps1 -Security
          ./scripts/smoke.ps1
          ./scripts/smoke.ps1 -Restart
          ./scripts/smoke.ps1 -Regression
          ./scripts/smoke.ps1 -Memory
      - run: ${{ matrix.command }}
      - name: Verify Windows package contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -VerifyPackage
      - name: Write download checksums
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),c=require("node:crypto"); const files=fs.readdirSync("dist").filter(f=>/^floatdot-.*\.(exe|dmg|zip|AppImage)$/.test(f)).sort(); if(!files.length)throw Error("No downloads"); fs.writeFileSync("dist/SHA256SUMS.txt",files.map(f=>c.createHash("sha256").update(fs.readFileSync("dist/"+f)).digest("hex")+"  "+f).join("\n")+"\n");'
      - uses: actions/upload-artifact@v7
        with:
          name: floatdot-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
# Builds downloadable artifacts for review. This workflow does not publish
# a release or claim that a build has passed a real desktop acceptance test.
